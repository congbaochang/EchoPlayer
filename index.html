<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EchoPlayer Pro | Shadowing Tool</title>
    <link rel="stylesheet" href="assets/index.css?v=1.33">
</head>
<body>

<div class="sidebar">
    <h2>📺 Episodes</h2>
    <div id="playlist">
        <p style="color: #666; font-size: 14px; text-align: center;">Loading resources...</p>
    </div>
</div>

<div class="main-content">
    <h2 id="currentEpTitle">Select an episode to start</h2>
    <video id="player" controls playsinline></video>

    <div id="intensiveDashboard" class="shadowing-dashboard" style="display: none;">
        <div class="status-left" style="display: flex; align-items: center; gap: 5px;">
            <strong>📍 Saved Segments:</strong>
            <select id="savedSegmentsSelect" class="btn secondary btn-sm" style="margin: 0; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: white; color: #333; max-width: 150px; cursor: pointer;">
            </select>
            <button id="btnDeleteSegment" class="btn secondary btn-sm" style="margin: 0; padding: 4px 8px;" title="Delete current segment">🗑️</button>
        </div>
        <div id="subChunkControls" style="display: none; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <select id="subChunkDuration" class="btn secondary btn-sm" style="margin: 0; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: white; color: #333;">
                <option value="10">10s</option>
                <option value="15">15s</option>
                <option value="20">20s</option>
                <option value="30" selected>30s</option>
                <option value="45">45s</option>
                <option value="60">60s</option>
            </select>
            <button class="btn secondary btn-sm" id="btnToggleSubMode" style="margin: 0;">🧩 Micro-Loop: OFF</button>
            <div id="subChunkNav" class="status-center" style="display: none; margin: 0; padding: 4px 15px;">
                <span id="subChunkInfo" style="color: #28a745; font-weight: bold; font-size: 13px;">0 / 0</span>
                <div class="btn-group-sm">
                    <button class="btn secondary btn-sm" id="btnPrevSubChunk" style="margin: 0;">Prev</button>
                    <button class="btn secondary btn-sm" id="btnNextSubChunk" style="margin: 0;">Next</button>
                </div>
            </div>
        </div>

        <div class="status-right">
            <button class="btn success btn-sm" id="btnPlaySaved" style="margin: 0;">▶️ Play / Reset Segment</button>
        </div>
    </div>

    <div class="controls-grid">
        <div class="control-group">
            <h3>🔄 Setup Loop</h3>
            <div class="btn-group-row btn-group-row-4">
                <button class="btn" id="btnSetStart">Set [A]</button>
                <button class="btn" id="btnSetEnd">Set [B]</button>
                <button class="btn success" id="btnToggleLoop">Loop OFF</button>
                <button class="btn secondary" id="btnJumpToStart">Replay [A]</button>
            </div>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 5px;">
                Manual (MM:SS):
                <input type="text" id="manualA" style="width: 60px;" placeholder="00:00"> to
                <input type="text" id="manualB" style="width: 60px;" placeholder="00:00">
                <button class="btn secondary" id="btnApplyManual" style="padding: 5px 10px;">Apply</button>
            </div>
            <button class="btn warning" id="btnSaveSegment" style="width: 100%; margin-top: 15px;">💾 Save Gold Segment</button>
        </div>

        <div class="control-group">
            <h3>💬 Subtitles & Tools</h3>
            <div id="sentenceControlPlaceholder">
                <div id="sentenceControlWrapper">
                    <div class="btn-group-row btn-group-row-3" style="margin-bottom: 0;">
                        <button class="btn secondary" id="btnPrevSentence">⏮️ Prev</button>
                        <button class="btn" id="btnRepeatSentence">🔁 Loop</button>
                        <button class="btn secondary" id="btnNextSentence">Next ⏭️</button>
                    </div>
                </div>
            </div>

            <div style="border-top: 1px solid #ddd; margin-top: 10px; padding-top: 10px;">
                <div class="btn-group-row btn-group-row-3 sub-toggle-group" style="margin-bottom: 10px;">
                    <button class="btn sub-toggle" data-sub="none">🚫 No Sub</button>
                    <button class="btn sub-toggle active" data-sub="en">🇬🇧 English</button>
                    <button class="btn sub-toggle" data-sub="bilingual">🌐 Bilingual</button>
                </div>
                <div class="btn-group-row btn-group-row-3">
                    <button class="btn secondary" id="btnMinus">-1 Sec</button>
                    <button class="btn secondary" id="btnPlus">+1 Sec</button>
                    <button class="btn secondary" id="btnBlindMode">👁️ Blind Mode</button>
                </div>
                <div style="margin-top: 10px; margin-bottom: 5px;">
                    Speed:
                    <select id="speedSelector">
                        <option value="1.0">1.0x</option>
                        <option value="0.9">0.9x</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.7">0.7x</option>
                        <option value="0.5">0.5x</option>
                        <option value="0.3">0.3x</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Application State ---
    const player = document.getElementById('player');
    let currentEpKey = null;
    let loopStart = -1;
    let loopEnd = -1;
    let isLooping = false;
    let isBlind = false;
    let savedSegments = {};

    // Sub-chunking State
    let currentSubtitles = [];
    let subChunks = [];
    let currentSubChunkIndex = -1;
    let isSubChunkMode = false;
    // Sentence Mode State
    let isSentenceLooping = false;
    let preSentenceState = { start: -1, end: -1, isLooping: false };

    // --- SRT Parsing Logic ---
    function parseSrtToArray(srtText) {
        const subs = [];
        const regex = /(\d{2}:\d{2}:\d{2}[.,]\d{3}) --> (\d{2}:\d{2}:\d{2}[.,]\d{3})/g;
        let match;
        while ((match = regex.exec(srtText)) !== null) {
            subs.push({
                start: srtTimeToSec(match[1]),
                end: srtTimeToSec(match[2])
            });
        }
        return subs;
    }

    function srtTimeToSec(timeStr) {
        const parts = timeStr.replace(',', '.').split(':');
        return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
    }

    // --- Sub-Chunking Logic ---
    function generateSubChunksFromSaved(rangeStart, rangeEnd) {
        subChunks = [];
        const relevantSubs = currentSubtitles.filter(s => s.start >= rangeStart && s.end <= rangeEnd);
        const targetDuration = parseInt(document.getElementById('subChunkDuration').value, 10) || 30;

        if (relevantSubs.length === 0) {
            for (let t = rangeStart; t < rangeEnd; t += targetDuration) {
                subChunks.push({ start: t, end: Math.min(t + targetDuration, rangeEnd) });
            }
        } else {
            let chunkStart = rangeStart;
            for (let i = 0; i < relevantSubs.length; i++) {
                if (relevantSubs[i].end - chunkStart >= targetDuration || i === relevantSubs.length - 1) {
                    let chunkEnd = (i === relevantSubs.length - 1) ? rangeEnd : relevantSubs[i].end;
                    subChunks.push({ start: chunkStart, end: chunkEnd });
                    chunkStart = chunkEnd;
                }
            }
        }

        currentSubChunkIndex = 0;
        document.getElementById('subChunkControls').style.display = 'flex';
        updateSubChunkUI();
    }

    function updateSubChunkUI() {
        document.getElementById('subChunkInfo').innerText = `${currentSubChunkIndex + 1} / ${subChunks.length}`;
    }

    function applySubChunk() {
        if (currentSubChunkIndex < 0 || subChunks.length === 0) return;
        const chunk = subChunks[currentSubChunkIndex];

        loopStart = chunk.start;
        loopEnd = chunk.end;

        updateLoopInputs();
        isLooping = true;

        const loopBtn = document.getElementById('btnToggleLoop');
        loopBtn.innerText = "Loop ON";
        loopBtn.style.background = "#dc3545";

        player.currentTime = loopStart;
        player.play();
        updateSubChunkUI();
    }

    document.getElementById('btnNextSubChunk').onclick = () => {
        if (currentSubChunkIndex < subChunks.length - 1) {
            currentSubChunkIndex++;
            applySubChunk();
        }
    };

    document.getElementById('btnPrevSubChunk').onclick = () => {
        if (currentSubChunkIndex > 0) {
            currentSubChunkIndex--;
            applySubChunk();
        }
    };

    // --- Initialization & Networking ---
    async function initApp() {
        const statusTxt = document.getElementById('currentEpTitle');
        statusTxt.innerText = "⏳ Synchronizing with Server...";
        try {
            const dataRes = await fetch('/api/segments/get');
            const rawSegments = await dataRes.json();
            savedSegments = {};
            for (let key in rawSegments) {
                if (Array.isArray(rawSegments[key])) {
                    savedSegments[key] = rawSegments[key];
                } else if (rawSegments[key] && typeof rawSegments[key] === 'object') {
                    savedSegments[key] = [rawSegments[key]];
                }
            }
            const listRes = await fetch('/api/list');
            const categories = await listRes.json();
            renderPlaylist(categories);
            statusTxt.innerText = "☁️ Local Server Connected";
        } catch (err) {
            console.error(err);
            statusTxt.innerText = "❌ Connection Failed.";
        }
    }

    async function syncToServer() {
        try {
            await fetch('/api/segments/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(savedSegments)
            });
        } catch (err) {}
    }

    // --- UI Rendering ---
    function renderPlaylist(categories) {
        const playlist = document.getElementById('playlist');
        playlist.innerHTML = '';
        categories.forEach((cat, index) => {
            const folderDiv = document.createElement('div');
            folderDiv.className = 'folder-item';
            folderDiv.innerHTML = `📁 ${cat.alias} <span style="float:right; font-size:12px; color:#666;">${cat.episodes.length} files</span>`;

            const epContainer = document.createElement('div');
            epContainer.id = `cat-${index}`;
            epContainer.style.display = 'none';
            epContainer.style.paddingLeft = '10px';

            folderDiv.onclick = () => {
                const isHidden = epContainer.style.display === 'none';
                document.querySelectorAll('[id^="cat-"]').forEach(el => el.style.display = 'none');
                epContainer.style.display = isHidden ? 'block' : 'none';
            };

            cat.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.id = 'ep-' + ep.key.replace(/[^a-zA-Z0-9]/g, '-');
                const segs = savedSegments[ep.key];
                const hasSave = segs && segs.length > 0;
                const badgeHtml = hasSave ? `<span class="badge">${segs.length} Save${segs.length > 1 ? 's' : ''}</span>` : '';
                div.innerHTML = `<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">🎬 ${ep.key}</span>${badgeHtml}`;

                div.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    playVideo(ep);
                    checkSavedSegmentUI();
                };
                epContainer.appendChild(div);
            });
            playlist.appendChild(folderDiv);
            playlist.appendChild(epContainer);
        });
    }

    let currentSessionId = 0;
    let currentBlobUrls = [];
    let currentSubMode = 'en';

    function clearOldTracks() {
        currentBlobUrls.forEach(url => URL.revokeObjectURL(url));
        currentBlobUrls = [];

        const oldTracks = player.querySelectorAll('track');
        oldTracks.forEach(t => t.remove());

        if (player.textTracks) {
            for (let i = 0; i < player.textTracks.length; i++) {
                player.textTracks[i].mode = 'disabled';
            }
        }
    }

    // --- Media & Subtitle Management ---
    function playVideo(ep) {
        currentSessionId++;
        const thisSession = currentSessionId;

        currentEpKey = ep.key;
        clearOldTracks();

        player.src = ep.video;
        document.getElementById('currentEpTitle').innerText = "Playing: " + ep.key;

        // Reset subchunks on new video
        subChunks = [];
        currentSubtitles = [];
        document.getElementById('subChunkControls').style.display = 'none';

        const shouldPushUp = ep.key.includes('雅思') || ep.key.toUpperCase().includes('PTE') || 
                             (ep.video && (ep.video.includes('雅思') || ep.video.toUpperCase().includes('PTE')));
        if (ep.enSrt) addRemoteTrack(ep.enSrt, 'en', 'English', shouldPushUp, thisSession);
        if (ep.cnSrt) addRemoteTrack(ep.cnSrt, 'zh', 'Bilingual', shouldPushUp, thisSession);

        player.play();
        setTimeout(applySubtitleSelection, 300);
    }

    function addRemoteTrack(url, lang, label, shouldPushUp, sessionId) {
        fetch(url, { cache: 'no-store' })
            .then(r => {
                if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
                return r.text();
            })
            .then(text => {
                if (sessionId !== currentSessionId) return;

                const parsed = parseSrtToArray(text);
                if (lang === 'en' || currentSubtitles.length === 0) {
                    currentSubtitles = parsed;
                }

                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.srclang = lang;
                track.label = label;
                const blobUrl = srtToVtt(text, shouldPushUp);
                currentBlobUrls.push(blobUrl);
                track.src = blobUrl;
                track.dataset.session = sessionId;

                track.onload = () => {
                    if (sessionId === currentSessionId) {
                        applySubtitleSelection();
                    }
                };

                player.appendChild(track);
                applySubtitleSelection();
            })
            .catch(err => {
                console.error("Failed to load subtitle:", url, err);
            });
    }

    function srtToVtt(srtText, shouldPushUp) {
        let vttText = "WEBVTT\n\n";
        let processedText = srtText.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
        processedText = processedText.replace(/\{[^}]+\}/g, '');
        if (shouldPushUp) {
            // Append invisible blank lines to push text upwards while preserving native wrapping
            processedText = processedText.replace(/\r?\n\r?\n/g, '\n&nbsp;\n&nbsp;\n&nbsp;\n\n');
        }
        vttText += processedText;
        return URL.createObjectURL(new Blob([vttText], { type: 'text/vtt' }));
    }

    function applySubtitleSelection() {
        const val = currentSubMode;
        if (!player.textTracks) return;

        const currentTrackElements = Array.from(player.querySelectorAll('track')).filter(
            t => t.dataset.session == currentSessionId
        );

        for (let i = 0; i < player.textTracks.length; i++) {
            player.textTracks[i].mode = 'disabled';
        }

        if (val === 'none') return;

        for (let i = 0; i < player.textTracks.length; i++) {
            const tt = player.textTracks[i];
            const isMatch = (val === 'en' && tt.language === 'en') || (val === 'bilingual' && (tt.language === 'zh' || tt.language === 'bilingual'));
            const belongsToCurrent = currentTrackElements.some(t => t.track === tt || (t.srclang === tt.language && t.label === tt.label));
            if (isMatch && belongsToCurrent) {
                tt.mode = 'showing';
            }
        }
    }

    // --- Subtitle toggle buttons ---
    document.querySelectorAll('.sub-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.sub-toggle').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentSubMode = this.dataset.sub;
            applySubtitleSelection();
        });
    });

    // --- Shadowing Controls ---
    function parseTime(str) {
        const parts = str.split(':').map(Number);
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return parseFloat(str);
    }

    function formatTime(seconds) {
        if (seconds < 0) return "--:--";
        return new Date(seconds * 1000).toISOString().substr(14, 5);
    }

    function updateLoopInputs() {
        document.getElementById('manualA').value = formatTime(loopStart);
        document.getElementById('manualB').value = formatTime(loopEnd);
    }

    document.getElementById('btnApplyManual').addEventListener('click', () => {
        const a = parseTime(document.getElementById('manualA').value);
        const b = parseTime(document.getElementById('manualB').value);
        if (!isNaN(a) && !isNaN(b) && b > a) {
            loopStart = a; loopEnd = b;
            updateLoopInputs();
        }
    });

    document.getElementById('btnSetStart').addEventListener('click', () => { loopStart = player.currentTime; updateLoopInputs(); });
    document.getElementById('btnSetEnd').addEventListener('click', () => { loopEnd = player.currentTime; updateLoopInputs(); });
    document.getElementById('btnJumpToStart').addEventListener('click', () => { if (loopStart >= 0) { player.currentTime = loopStart; player.play(); } });

    const loopBtn = document.getElementById('btnToggleLoop');
    loopBtn.addEventListener('click', () => {
        isLooping = !isLooping;
        loopBtn.innerText = isLooping ? "Loop ON" : "Loop OFF";
        loopBtn.style.background = isLooping ? "#dc3545" : "#28a745";
        if (isLooping && loopStart >= 0) { player.currentTime = loopStart; player.play(); }
    });

    player.addEventListener('timeupdate', () => {
        if (isLooping && player.currentTime >= loopEnd && loopEnd > 0) {
            player.currentTime = loopStart + 0.01;
            player.play();
        }
    });

    // --- Data Persistence UI ---
    function checkSavedSegmentUI() {
        const dashboard = document.getElementById('intensiveDashboard');
        const selectBox = document.getElementById('savedSegmentsSelect');

        if (currentEpKey && savedSegments[currentEpKey] && savedSegments[currentEpKey].length > 0) {
            dashboard.style.display = 'flex'; // Changed to flex for horizontal layout
            
            // Retain selected index if possible
            const prevSelectedIndex = selectBox.selectedIndex;
            
            selectBox.innerHTML = '';
            savedSegments[currentEpKey].forEach((seg, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `Seg ${index + 1}: ${formatTime(seg.start)} - ${formatTime(seg.end)}`;
                selectBox.appendChild(opt);
            });
            
            if (prevSelectedIndex >= 0 && prevSelectedIndex < selectBox.options.length) {
                selectBox.selectedIndex = prevSelectedIndex;
            }
        } else {
            dashboard.style.display = 'none';
        }
    }

    document.getElementById('btnSaveSegment').onclick = async () => {
        if (!currentEpKey || loopStart < 0 || loopEnd < 0) return;
        if (!savedSegments[currentEpKey]) {
            savedSegments[currentEpKey] = [];
        }
        
        // Prevent duplicate saves
        const exists = savedSegments[currentEpKey].some(s => Math.abs(s.start - loopStart) < 0.1 && Math.abs(s.end - loopEnd) < 0.1);
        if (exists) return;
        
        savedSegments[currentEpKey].push({ start: loopStart, end: loopEnd });
        await syncToServer();
        
        const safeId = 'ep-' + currentEpKey.replace(/[^a-zA-Z0-9]/g, '-');
        const itemUI = document.getElementById(safeId);
        if (itemUI) {
            const badge = itemUI.querySelector('.badge');
            const segCount = savedSegments[currentEpKey].length;
            const badgeText = `${segCount} Save${segCount > 1 ? 's' : ''}`;
            if (badge) {
                badge.innerText = badgeText;
            } else {
                itemUI.innerHTML += `<span class="badge">${badgeText}</span>`;
            }
        }
        
        checkSavedSegmentUI();
        const selectBox = document.getElementById('savedSegmentsSelect');
        if (selectBox) selectBox.selectedIndex = selectBox.options.length - 1;
    };

    document.getElementById('btnDeleteSegment').addEventListener('click', async () => {
        const segs = savedSegments[currentEpKey];
        const selectBox = document.getElementById('savedSegmentsSelect');
        if (segs && segs.length > 0 && selectBox) {
            const ans = prompt('请输入"确认删除"以确认删除该片段:');
            if (ans !== '确认删除') return;

            const index = selectBox.value;
            segs.splice(index, 1);
            
            if (segs.length === 0) {
                delete savedSegments[currentEpKey];
            }
            
            await syncToServer();
            
            const safeId = 'ep-' + currentEpKey.replace(/[^a-zA-Z0-9]/g, '-');
            const itemUI = document.getElementById(safeId);
            if (itemUI) {
                const badge = itemUI.querySelector('.badge');
                if (badge) {
                    if (!savedSegments[currentEpKey]) {
                        badge.remove();
                    } else {
                        badge.innerText = `${segs.length} Save${segs.length > 1 ? 's' : ''}`;
                    }
                }
            }
            
            checkSavedSegmentUI();
            
            if (savedSegments[currentEpKey] && savedSegments[currentEpKey].length > 0) {
                document.getElementById('btnPlaySaved').click();
            } else {
                isLooping = false;
                const loopBtn = document.getElementById('btnToggleLoop');
                if (loopBtn) {
                    loopBtn.innerText = "Loop OFF";
                    loopBtn.style.background = "#28a745";
                }
                player.pause();
            }
        }
    });

    document.getElementById('btnPlaySaved').addEventListener('click', () => {
        const segs = savedSegments[currentEpKey];
        const selectBox = document.getElementById('savedSegmentsSelect');
        if (segs && segs.length > 0 && selectBox) {
            const data = segs[selectBox.value];
            if (!data) return;
            loopStart = data.start;
            loopEnd = data.end;
            updateLoopInputs();

            isLooping = true;
            const loopBtn = document.getElementById('btnToggleLoop');
            loopBtn.innerText = "Loop ON";
            loopBtn.style.background = "#dc3545";

            player.currentTime = loopStart;
            player.play();

            generateSubChunksFromSaved(data.start, data.end);

            isSubChunkMode = false;
            document.getElementById('btnToggleSubMode').innerText = "🧩 Micro-Loop: OFF";
            document.getElementById('btnToggleSubMode').className = "btn secondary btn-sm";
            document.getElementById('subChunkNav').style.display = "none";
        }
    });

    document.getElementById('btnToggleSubMode').addEventListener('click', (e) => {
        isSubChunkMode = !isSubChunkMode;
        const navUI = document.getElementById('subChunkNav');
        if (isSubChunkMode) {
            e.target.innerText = "🧩 Micro-Loop: ON";
            e.target.className = "btn warning btn-sm";
            navUI.style.display = "flex";

            if (currentSubChunkIndex < 0) currentSubChunkIndex = 0;
            applySubChunk();
        } else {
            e.target.innerText = "🧩 Micro-Loop: OFF";
            e.target.className = "btn secondary btn-sm";
            navUI.style.display = "none";

            const segs = savedSegments[currentEpKey];
            const selectBox = document.getElementById('savedSegmentsSelect');
            if (segs && segs.length > 0 && selectBox) {
                const data = segs[selectBox.value];
                if (!data) return;
                loopStart = data.start;
                loopEnd = data.end;
                updateLoopInputs();
                player.currentTime = loopStart;
                player.play();
            }
        }
    });

    document.getElementById('subChunkDuration').addEventListener('change', () => {
        const segs = savedSegments[currentEpKey];
        const selectBox = document.getElementById('savedSegmentsSelect');
        if (currentEpKey && segs && segs.length > 0 && selectBox) {
            const data = segs[selectBox.value];
            if (!data) return;
            generateSubChunksFromSaved(data.start, data.end);
            if (isSubChunkMode) {
                applySubChunk();
            }
        }
    });

    // Removed auto-play on select change

    // --- Utilities & Hotkeys ---
    document.getElementById('btnMinus').addEventListener('click', () => player.currentTime = Math.max(0, player.currentTime - 1));
    document.getElementById('btnPlus').addEventListener('click', () => player.currentTime += 1);
    document.getElementById('speedSelector').addEventListener('change', (e) => player.playbackRate = parseFloat(e.target.value));

    document.getElementById('btnBlindMode').addEventListener('click', (e) => {
        isBlind = !isBlind;
        player.style.filter = isBlind ? 'brightness(0)' : 'none';
        e.target.style.background = isBlind ? '#343a40' : '#6c757d';
    });

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        switch(e.key.toLowerCase()) {
            case ' ': e.preventDefault(); player.paused ? player.play() : player.pause(); break;
            case 'arrowleft': player.currentTime = Math.max(0, player.currentTime - 1); break;
            case 'arrowright': player.currentTime += 1; break;
            case 'r': if (loopStart >= 0) { player.currentTime = loopStart; player.play(); } break;
            case '[':
                if (isSubChunkMode && currentSubChunkIndex > 0) {
                    currentSubChunkIndex--;
                    applySubChunk();
                }
                break;
            case ']':
                if (isSubChunkMode && currentSubChunkIndex < subChunks.length - 1) {
                    currentSubChunkIndex++;
                    applySubChunk();
                }
                break;
        }
    });
    // --- Sentence Intensive Logic ---

    function getCurrentSubtitleIndex() {
        const time = player.currentTime;
        return currentSubtitles.findIndex(s => time >= s.start && time < s.end);
    }

    function jumpToSentence(index) {
        if (index < 0 || index >= currentSubtitles.length) return;

        player.currentTime = currentSubtitles[index].start + 0.01;

        if (isSentenceLooping) {
            loopStart = currentSubtitles[index].start;
            loopEnd = currentSubtitles[index].end;
            updateLoopInputs();
        }
    }

    function applySentenceLoop(index) {
        if (index < 0 || index >= currentSubtitles.length) return;
        const sub = currentSubtitles[index];

        loopStart = sub.start;
        loopEnd = sub.end;
        updateLoopInputs();

        player.currentTime = loopStart + 0.01;
        player.play();

        isLooping = true;
        const loopBtn = document.getElementById('btnToggleLoop');
        loopBtn.innerText = "Loop ON";
        loopBtn.style.background = "#dc3545";
    }

    document.getElementById('btnPrevSentence').onclick = () => {
        let idx = getCurrentSubtitleIndex();
        const time = player.currentTime;
        if (idx !== -1) {
            if (idx > 0) {
                jumpToSentence(idx - 1);
            } else {
                jumpToSentence(0);
            }
        } else {
            let prevIdx = currentSubtitles.findLastIndex(s => s.end < time);
            if(prevIdx !== -1) jumpToSentence(prevIdx);
        }
    };

    document.getElementById('btnNextSentence').onclick = () => {
        let idx = getCurrentSubtitleIndex();
        if (idx !== -1 && idx < currentSubtitles.length - 1) {
            jumpToSentence(idx + 1);
        } else if (idx === -1) {
            let nextIdx = currentSubtitles.findIndex(s => s.start > time);
            if(nextIdx !== -1) jumpToSentence(nextIdx);
        }
    };

    document.getElementById('btnRepeatSentence').onclick = function() {
        const btn = this;
        if (!isSentenceLooping) {
            let idx = getCurrentSubtitleIndex();
            if (idx === -1) return;

            preSentenceState = { start: loopStart, end: loopEnd, isLooping: isLooping };
            isSentenceLooping = true;
            btn.innerText = "Exit Loop";
            btn.className = "btn warning";

            applySentenceLoop(idx);
        } else {
            isSentenceLooping = false;
            btn.innerText = "🔁 Loop";
            btn.className = "btn";

            loopStart = preSentenceState.start;
            loopEnd = preSentenceState.end;
            isLooping = preSentenceState.isLooping;

            const loopBtn = document.getElementById('btnToggleLoop');
            loopBtn.innerText = isLooping ? "Loop ON" : "Loop OFF";
            loopBtn.style.background = isLooping ? "#dc3545" : "#28a745";
            updateLoopInputs();
        }
    };

    const sentenceWrapper = document.getElementById('sentenceControlWrapper');
    const sentencePlaceholder = document.getElementById('sentenceControlPlaceholder');

    if (sentenceWrapper && sentencePlaceholder) {
        const observer = new IntersectionObserver((entries) => {
            const entry = entries[0];
            if (!entry.isIntersecting && entry.boundingClientRect.top > 0) {
                sentenceWrapper.classList.add('floating-bottom-bar');
            } else {
                sentenceWrapper.classList.remove('floating-bottom-bar');
            }
        }, { threshold: 0 });
        observer.observe(sentencePlaceholder);
    }

    window.onload = initApp;
</script>
